name: Docs (GitHub Pages)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell toolchain
        uses: haskell/actions/setup@v2
        with:
          ghc-version: "9.6.6"
          cabal-version: "3.12.1.0"

      - name: System deps (Agda build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev zlib1g-dev

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
          key: ${{ runner.os }}-cabal-agda-2.7.0.1

      - name: Install Agda (pinned)
        run: |
          cabal update
          cabal install Agda-2.7.0.1 --installdir="$HOME/.local/bin" --install-method=copy --overwrite-policy=always
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build HTML (Agda)
        run: make html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

