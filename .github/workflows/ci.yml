name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  check-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell toolchain
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.6"
          cabal-version: "3.12.1.0"

      - name: System deps (Agda build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev zlib1g-dev ripgrep

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
          key: ${{ runner.os }}-cabal-agda-2.7.0.1

      - name: Install Agda (pinned)
        run: |
          cabal update
          cabal install Agda-2.7.0.1 --installdir="$HOME/.local/bin" --install-method=copy --overwrite-policy=always
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Full check (CI + full typecheck)
        run: |
          make check-all

      - name: Smoke test (library-file mode)
        run: |
          make clean
          make agda-lib-check
